# cargo-deny configuration. Run with `just audit`.
# See: https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
all-features = true
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
# Each ignored advisory is `unmaintained` on a transitive crate that no
# first-party dependency selects. A vulnerability advisory is never ignored
# here.
ignore = [
    # zbus 5 and its zvariant/zbus_names crates, pulled in by
    # tauri-plugin-notification (notify-rust) and tauri-plugin-single-instance.
    # The latest releases of both plugins still use zbus 5; re-check on each
    # plugin update.
    { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus 5 in tauri-plugin-notification and tauri-plugin-single-instance" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus 5 in tauri-plugin-notification and tauri-plugin-single-instance" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus 5 in tauri-plugin-notification and tauri-plugin-single-instance" },
    # proc-macro-error, a build-time transitive of gtk 0.18 (glib-macros) that
    # Tauri pulls in; re-check on Tauri updates.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, build-time transitive" },
]

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
