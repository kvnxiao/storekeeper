# Minimum release age (in minutes) before a published version is installable.
# 10080 = 7 days. Mirrors the Dependabot `cooldown` so the pnpm/Vite+ side
# (incl. the catalog packages below) also waits out fresh releases.
minimumReleaseAge: 10080
# The first-party Vite+ toolchain is exempt: its core/test/delegate packages
# must ship in matching same-day versions (mixing releases breaks vitest
# startup), so the cooldown would force incompatible pairings.
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: ^0.2.7
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
patchedDependencies:
  "@voidzero-dev/vite-plus-test": patches/@voidzero-dev__vite-plus-test.patch
