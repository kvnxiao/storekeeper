name: Rust linting

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Rust cross-platform linting
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Branch protection requires this job, so the gate sits on the steps below and
      # the job itself always runs and reports success.
      - name: Detect Rust changes
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          patterns: |
            \.rs$
            (^|/)Cargo\.(toml|lock)$
            ^clippy\.toml$
            ^\.rustfmt\.toml$
            ^justfile$
            ^\.github/workflows/rust-lint\.yaml$
            ^\.github/actions/detect-changes/action\.yml$

      - name: Install Linux dependencies
        if: steps.changes.outputs.changed == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt install libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            lld

      - name: Install Rust toolchain
        if: steps.changes.outputs.changed == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy, rustfmt
          # Comma-separated; the action makes the LAST entry the default
          # toolchain. Keep stable last so bare `cargo clippy` runs on stable.
          # `just lint-fmt` needs nightly and runs on ubuntu only.
          toolchain: ${{ matrix.os == 'ubuntu-latest' && 'nightly, stable' || 'stable' }}
          cache: true

      - name: Install just command runner
        if: steps.changes.outputs.changed == 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Run lint checks
        if: steps.changes.outputs.changed == 'true'
        run: just lint-clippy

      # rustfmt reads the same sources on every runner.
      - name: Run formatting checks
        if: steps.changes.outputs.changed == 'true' && matrix.os == 'ubuntu-latest'
        run: just lint-fmt
