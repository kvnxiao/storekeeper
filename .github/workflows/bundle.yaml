name: Bundle installers

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: Bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # AppImage and deb bundles link against the build host's glibc, so the
          # oldest supported Ubuntu runner produces bundles that run on more distributions.
          - name: linux-x86_64
            os: ubuntu-22.04
            artifact-paths: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
          - name: macos-universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin, x86_64-apple-darwin
            build-args: --target universal-apple-darwin
            artifact-paths: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows-x86_64
            os: windows-latest
            artifact-paths: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
              target/release/storekeeper.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt install libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          working-directory: frontend
          cache: true

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          target: ${{ matrix.rust-targets }}
          # The Rust linting workflow enforces warnings; a new compiler warning
          # should not block installer builds.
          build-warnings: warn
          cache: true
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Tauri CLI
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: tauri-cli

      - name: Build installers
        run: cargo tauri build ${{ matrix.build-args }}

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storekeeper-${{ matrix.name }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ matrix.artifact-paths }}
          if-no-files-found: error
