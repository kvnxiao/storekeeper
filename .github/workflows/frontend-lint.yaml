name: Frontend linting

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-linting:
    name: Frontend linting
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Branch protection requires this job, so the gate sits on the steps below and
      # the job itself always runs and reports success.
      - name: Detect frontend changes
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          patterns: |
            ^frontend/
            ^\.node-version$
            ^\.github/workflows/frontend-lint\.yaml$
            ^\.github/actions/detect-changes/action\.yml$

      - name: Set up Vite+ and install dependencies
        if: steps.changes.outputs.changed == 'true'
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version-file: .node-version
          working-directory: frontend
          cache: true

      - name: Run format, lint, and type checks
        if: steps.changes.outputs.changed == 'true'
        run: vp check
        working-directory: frontend
