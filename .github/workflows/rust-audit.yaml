name: Rust dependency audit

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The schedule runs the audit when a new advisory affects an unchanged lockfile.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The detector runs on every pull request; only dependency-related changes
      # run the audit steps.
      - name: Detect dependency changes
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          patterns: |
            (^|/)Cargo\.(toml|lock)$
            ^deny\.toml$
            ^justfile$
            ^\.github/workflows/rust-audit\.yaml$
            ^\.github/actions/detect-changes/action\.yml$

      # `just audit` runs cargo-deny as a cargo subcommand, so cargo must be on
      # PATH even though nothing here compiles.
      - name: Install Rust toolchain
        if: steps.changes.outputs.changed == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache: false

      - name: Install cargo-deny
        if: steps.changes.outputs.changed == 'true'
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-deny

      - name: Install just command runner
        if: steps.changes.outputs.changed == 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Run dependency audit
        if: steps.changes.outputs.changed == 'true'
        run: just audit
