name: Detect changes
description: Report whether a pull request touches paths matching the given patterns.

inputs:
  patterns:
    description: Newline-separated extended regular expressions matched against changed file paths.
    required: true

outputs:
  changed:
    description: '"true" when a matching path changed, when the event is not a pull request, or when the file list cannot be read.'
    value: ${{ steps.detect.outputs.changed }}

runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PATTERNS: ${{ inputs.patterns }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail

        if [ -z "${PR_NUMBER:-}" ]; then
          echo "Not a pull request; running every gated step."
          echo "changed=true" >>"$GITHUB_OUTPUT"
          exit 0
        fi

        # A failed lookup runs every gated step; silently skipping a required check is worse.
        if ! files=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename'); then
          echo "Could not read the changed-file list; running every gated step."
          echo "changed=true" >>"$GITHUB_OUTPUT"
          exit 0
        fi

        pattern=$(printf '%s' "$PATTERNS" | grep -v '^[[:space:]]*$' | tr '\n' '|' | sed 's/|$//')

        if matched=$(printf '%s\n' "$files" | grep -E "$pattern"); then
          echo "Matched:"
          printf '%s\n' "$matched"
          echo "changed=true" >>"$GITHUB_OUTPUT"
        else
          echo "No path matched $pattern"
          echo "changed=false" >>"$GITHUB_OUTPUT"
        fi
